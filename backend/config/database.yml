default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  <% if ENV["DATABASE_HOST"].present? %>
  host: <%= ENV["DATABASE_HOST"] %>
  port: <%= ENV.fetch("DATABASE_PORT", 5432) %>
  <% end %>
  username: <%= ENV.fetch("DATABASE_USERNAME") { ENV["USER"] } %>
  <% if ENV["DATABASE_PASSWORD"].present? %>
  password: <%= ENV["DATABASE_PASSWORD"] %>
  <% end %>

development:
  <<: *default
  database: lms_development

test:
  <<: *default
  database: lms_test

production:
  primary: &primary_production
    <<: *default
    database: lms_production
  cache:
    <<: *primary_production
    database: lms_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: lms_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: lms_production_cable
    migrations_paths: db/cable_migrate
